name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, the output, and what you expected instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `subcast --help`, `python -V`, `mpv --version`, and your terminal.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Terminal type, GPU, whether it reproduces on a second episode.
    validations:
      required: false
